name: Daily market update

on:
  schedule:
    - cron: "30 11 * * 1-5"   # Mon-Fri, 5:00 PM IST (market band hone ke baad)
  workflow_dispatch:           # haath se bhi chala sakte ho

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python update_data.py
      - name: Commit data
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/market.json
          git commit -m "Daily market data update" || echo "no changes"
          git push
